services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/roundtable.db
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?SESSION_HMAC_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN:?DOMAIN is required}}
      TRUST_PROXY_HOPS: "1"
      TOPIC_MODE: ${TOPIC_MODE:-verified}
      ALLOW_STATIC_TOPICS_IN_PRODUCTION: ${ALLOW_STATIC_TOPICS_IN_PRODUCTION:-false}
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
      ZHIHU_OAUTH_APP_ID: ${ZHIHU_OAUTH_APP_ID:-}
      ZHIHU_OAUTH_APP_KEY: ${ZHIHU_OAUTH_APP_KEY:-}
      ZHIHU_OAUTH_REDIRECT_URI: ${ZHIHU_OAUTH_REDIRECT_URI:-https://airoundtable.stream/api/auth/zhihu/callback}
      ZHIHU_TOPIC_CACHE_MS: ${ZHIHU_TOPIC_CACHE_MS:-604800000}
      ZHIHU_TOPIC_CACHE_PATH: ${ZHIHU_TOPIC_CACHE_PATH:-/app/data/topic-cache.json}
      ZHIHU_MIN_REQUEST_INTERVAL_MS: ${ZHIHU_MIN_REQUEST_INTERVAL_MS:-1000}
      ZHIHU_TOPIC_CANDIDATE_QUERY: ${ZHIHU_TOPIC_CANDIDATE_QUERY:-生活方式}
      ZHIHU_TOPIC_CANDIDATE_COUNT: ${ZHIHU_TOPIC_CANDIDATE_COUNT:-20}
      ZHIHU_TOPIC_CANDIDATE_PATH: ${ZHIHU_TOPIC_CANDIDATE_PATH:-/app/data/topic-candidates.json}
      ZHIHU_TOPIC_CANDIDATE_TTL_MS: ${ZHIHU_TOPIC_CANDIDATE_TTL_MS:-604800000}
      ZHIHU_TOPIC_CANDIDATE_TIMEOUT_MS: ${ZHIHU_TOPIC_CANDIDATE_TIMEOUT_MS:-3000}
      ZHIHU_ANSWERS_LIMIT: ${ZHIHU_ANSWERS_LIMIT:-20}
      ZHIHU_TOPIC_FALLBACK: ${ZHIHU_TOPIC_FALLBACK:-static}
      ZHIHU_TOPIC_UNION_ORDER: ${ZHIHU_TOPIC_UNION_ORDER:-curated-first}
      AI_MODE: live
      AI_ATTEMPT_TIMEOUT_MS: ${AI_ATTEMPT_TIMEOUT_MS:-14000}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      TOPIC_AI_MAX_TOKENS: ${TOPIC_AI_MAX_TOKENS:-2048}
      # Measured against the production model: median 6.5s, observed max 9.4s per
      # generation. An 8s budget silently pushed ~a quarter of topics onto the
      # deterministic fallback text.
      TOPIC_AI_TIMEOUT_MS: ${TOPIC_AI_TIMEOUT_MS:-18000}
      TOPIC_TIMEOUT_MS: ${TOPIC_TIMEOUT_MS:-30000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_ENDPOINT: ${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_ENDPOINT: ${GLM_ENDPOINT:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
      GLM_MODEL: ${GLM_MODEL:-glm-4-flash}
      GLM_THINKING: ${GLM_THINKING:-disabled}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - roundtable_data:/app/data
    # Local CI/temporary acceptance only; keep the app behind Caddy in a real deployment.
    ports:
      - "127.0.0.1:3000:3000"
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  roundtable_data:
  caddy_data:
  caddy_config:
