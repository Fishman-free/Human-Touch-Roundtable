name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run audit:repo
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run smoke:prod
      - run: npm run load:smoke
      - run: docker build -t human-touch-roundtable:ci .
      - run: docker compose config --quiet
        env:
          DOMAIN: roundtable.example.com
          SESSION_HMAC_KEY: ci-compose-session-key-at-least-32-bytes
          DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
          METRICS_TOKEN: ci-compose-metrics-token-at-least-24-bytes
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: roundtable.example.com
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      SESSION_HMAC_KEY: ci-compose-session-key-at-least-32-bytes
      TOPIC_MODE: static
      ALLOW_STATIC_TOPICS_IN_PRODUCTION: 'true'
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      ADMIN_TOKEN: ci-compose-admin-token-at-least-32-bytes
      METRICS_TOKEN: ci-compose-metrics-token-at-least-24-bytes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: docker compose -f compose.yaml -f compose.ci.yaml build app
      - name: Start isolated Compose app
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d app
      - name: Verify container health and persistence surface
        run: |
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/api/health/ready; then ready=1; break; fi; sleep 2; done
          test "${ready:-0}" = 1
          curl -fsS http://127.0.0.1:3000/api/health/live
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/admin/rooms)" = 401
          npm run compose:integration
          docker compose -f compose.yaml -f compose.ci.yaml exec -T app npm run backup -- /app/data/backups/ci.db
          docker compose -f compose.yaml -f compose.ci.yaml exec -T app test -s /app/data/backups/ci.db
          docker compose -f compose.yaml -f compose.ci.yaml restart app
          ready=0; for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3000/api/health/ready; then ready=1; break; fi; sleep 2; done
          test "$ready" = 1
      - name: Cleanup Compose resources
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v --remove-orphans
